name: Build releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a draft GitHub Release with all native packages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            asset: windows-x64
          - runner: ubuntu-22.04
            asset: linux-x64
          - runner: ubuntu-22.04-arm
            asset: linux-arm64
          - runner: macos-15-intel
            asset: macos-x64
          - runner: macos-14
            asset: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Check that the tag matches the source version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYTHONPATH: src
        run: python -c "import os; from antigravity_patcher import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag/version mismatch'"
      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and smoke-test native executable
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_draft)
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Merge checksums
        run: cat release-assets/*.sha256 > release-assets/SHA256SUMS.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: src
        shell: bash
        run: |
          RELEASE_TAG="$(python3 -c 'from antigravity_patcher import __version__; print("v" + __version__)')"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != true ]; then
              echo "::notice::Release $RELEASE_TAG is already published; keeping all published assets unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --target "$GITHUB_SHA" --title "Antigravity Local Patcher $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          fi
